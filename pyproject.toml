[build-system]e
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viemmo"
version = "0.1.0"
description = "Viemmo: An Offline, Privacy-Preserving Vietnamese LLM via 4-bit QLoRA on Consumer Hardware"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Viemmo Research Team", email = "contact@viemmo.local" }
]
keywords = [
    "llm",
    "vietnamese",
    "qlora",
    "quantization",
    "privacy",
    "offline-ai",
    "nlp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.5.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.30.0",
    "datasets>=3.0.0",
    "trl>=0.8.0",
    "tokenizers>=0.19.0",
    "safetensors>=0.4.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
eval = [
    "evaluate>=0.4.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
]
deploy = [
    "llama-cpp-python>=0.2.70",
]

[project.scripts]
viemmo-validate = "scripts.validate_dataset:main"
viemmo-eval-baseline = "scripts.run_baseline_evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
